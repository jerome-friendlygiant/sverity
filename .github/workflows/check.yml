name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push replaces the run already going on the same branch.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      SVERITY_JOBS: 4
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache
      - uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-
      - name: Build, test and run the public-RTL gate
        run: tools/dev/check.sh
      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats
